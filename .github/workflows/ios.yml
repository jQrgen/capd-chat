name: iOS peer

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  protocol:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: ./gradlew :shared:jvmTest --no-daemon
        working-directory: ios
